<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../../assets/favicon/favicon.ico">
  <title>Programmazione interventi verde e strade</title>
  <!-- Bootstrap 2 di Lizmap + tema Prosit (un solo file) -->
  <link rel="stylesheet" href="../../assets/prosit.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container my-3">
    <div class="controls-user">
      <div id="login-line" class="manteiner-line" hidden>—</div>
      <div id="manteiner-sub" class="manteiner-sub"></div>
    </div>

    <div class="card mb-3">
      <div class="card-body py-3">
        <div class="controls d-flex align-items-center justify-content-between">
          <div class="month-nav d-flex justify-content-center align-items-center gap-2 w-100">
            <button type="button" id="btn-prev" class="btn btn-outline-primary btn-sm" aria-label="Mese precedente"><i class="icon-chevron-left"></i></button>
            <span id="month-label" class="month-label"></span>
            <button type="button" id="btn-next" class="btn btn-outline-primary btn-sm" aria-label="Mese successivo"><i class="icon-chevron-right"></i></button>
            <button type="button" id="btn-today" class="btn btn-link btn-sm px-1">Oggi</button>
          </div>
          <button type="button" id="btn-nuovo" class="btn btn-primary btn-nuovo ms-auto"><i class="icon-plus icon-white"></i> Nuovo</button>
        </div>
      </div>
    </div>

    <div id="msg-noeditor" class="alert" hidden>
      Il tuo utente non è abilitato all'inserimento della programmazione.
    </div>

    <div id="legenda" class="legenda"></div>

    <div class="card">
      <div class="card-body p-1">
        <div id="cal-loading" class="text-center py-5 text-muted"><span class="p-spinner"></span></div>
        <div id="calendar" class="calendar" hidden></div>
      </div>
    </div>

    <p class="mt-2 small text-muted d-none d-md-block">
      Clicca su un giorno per aggiungere un intervento o modificarlo.
    </p>
  </main>

  <!-- MODALE DETTAGLIO GIORNO (Bootstrap 2: classe "hide", data-dismiss) -->
  <div class="modal hide fade" tabindex="-1" id="modal-day" role="dialog" aria-labelledby="modal-day-title" aria-hidden="true">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-day-title">Giorno</h3>
      <button class="close" type="button" data-dismiss="modal" aria-label="Chiudi">&times;</button>
    </div>
    <div class="modal-body">
      <div id="day-list"></div>
      <button type="button" id="btn-add-day" class="btn btn-primary w-100 mt-2"><i class="icon-plus icon-white"></i> Aggiungi intervento</button>
    </div>
  </div>

  <!-- MODALE INTERVENTO -->
  <div class="modal hide fade" tabindex="-1" id="modal-intervento" role="dialog" aria-labelledby="modal-intervento-title" aria-hidden="true">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-intervento-title">Nuovo intervento</h3>
      <button class="close" type="button" data-dismiss="modal" aria-label="Chiudi">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <input type="hidden" id="f-fonte">

      <div class="mb-3">
        <label for="f-data">Data pianificata</label>
        <input type="date" id="f-data" class="form-control">
      </div>

      <div class="mb-3">
        <label for="f-tipo">Tipo di intervento</label>
        <select id="f-tipo" class="form-select"></select>
      </div>

      <div class="mb-3 combo" id="combo-oggetto">
        <label for="f-oggetto-input" id="lbl-oggetto">Zona / area verde</label>
        <input type="text" id="f-oggetto-input" class="form-control" autocomplete="off"
               role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="f-oggetto-list" placeholder="Scrivi per cercare…">
        <input type="hidden" id="f-oggetto-id">
        <ul id="f-oggetto-list" class="combo-list" role="listbox" hidden></ul>
      </div>

      <div class="form-check">
        <input type="checkbox" id="f-eseguito" class="form-check-input">
        <label for="f-eseguito" class="form-check-label">Intervento già eseguito</label>
      </div>
      <div class="mt-2" id="grp-dataex" hidden>
        <label for="f-dataex">Data esecuzione</label>
        <input type="date" id="f-dataex" class="form-control">
      </div>

      <div id="ripeti-box" class="mt-2">
        <div class="form-check">
          <input type="checkbox" id="f-ripeti" class="form-check-input">
          <label for="f-ripeti" class="form-check-label">Ripeti su più giorni</label>
        </div>
        <div id="ripeti-dettagli" hidden>
          <div class="mt-2 mb-2">
            <label for="f-ripeti-fino">Ripeti fino al</label>
            <input type="date" id="f-ripeti-fino" class="form-control">
          </div>
          <span class="form-label">Giorni della settimana</span>
          <div class="giorni-group">
            <label class="giorno-pill"><input type="checkbox" value="1">L</label>
            <label class="giorno-pill"><input type="checkbox" value="2">M</label>
            <label class="giorno-pill"><input type="checkbox" value="3">M</label>
            <label class="giorno-pill"><input type="checkbox" value="4">G</label>
            <label class="giorno-pill"><input type="checkbox" value="5">V</label>
            <label class="giorno-pill"><input type="checkbox" value="6">S</label>
            <label class="giorno-pill"><input type="checkbox" value="7">D</label>
          </div>
          <p class="small text-muted mt-1 mb-0">Lascia vuoti i giorni per ripetere tutti i giorni del periodo.</p>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" id="btn-elimina" class="btn btn-outline-danger me-auto" hidden><i class="icon-trash"></i> Elimina</button>
      <button type="button" class="btn btn-outline-primary" data-dismiss="modal">Annulla</button>
      <button type="button" id="btn-salva" class="btn btn-primary">Salva</button>
    </div>
  </div>

  <!-- jQuery e Bootstrap 2 di Lizmap (gli stessi della mappa) -->
  <script src="../../../assets/js/jquery/jquery-3.5.1.min.js"></script>
  <script src="../../../assets/js/jquery/jquery-migrate-3.3.1.min.js"></script>
  <script src="../../../assets/js/bootstrap.min.js"></script>
  <script src="../../assets/prosit-api-v2.js"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
