<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="../../assets/favicon/favicon.ico">
  <title>Scheda segnalazione</title>
  <link rel="stylesheet" href="../assets/prosit.css">
</head>
<body class="p-sheet">
  <div id="app-loader" class="p-loader"><span class="p-spinner" aria-hidden="true"></span>Caricamento dati in corso…</div>
  <div id="app-error" class="p-error" role="alert" hidden></div>

  <main id="app-content" hidden>
    <article class="p-card">
      <header id="ticket-header" class="p-head">
        <div class="p-toolbar">
          <span id="header-alias" class="p-title"></span>
          <button type="button" class="btn btn-small" data-action="print" title="Stampa"><i class="icon-print" aria-hidden="true"></i></button>
          <button type="button" class="btn btn-small" data-action="reload" title="Aggiorna"><i class="icon-refresh" aria-hidden="true"></i></button>
          <button type="button" class="btn btn-small" id="send-mail-btn" title="Invia il ticket via mail" hidden><i class="icon-envelope" aria-hidden="true"></i></button>
        </div>
        <p id="header-status" class="p-status"></p>
      </header>

      <div class="p-body">
        <p class="p-meta">Ultimo aggiornamento: <span id="update-date">—</span></p>
        <h1 id="seg-title"></h1>

        <details class="p-section" data-part="richiesta" open>
          <summary>Richiesta</summary>
          <div id="richiesta-fields"></div>
        </details>

        <details class="p-section" data-part="localizzazione">
          <summary>Localizzazione</summary>
          <div id="loc-fields"></div>
          <a id="maps-link" class="btn btn-primary p-link-btn" href="#" target="_blank" rel="noopener" hidden><i class="icon-map-marker icon-white" aria-hidden="true"></i> Apri in Maps</a>
        </details>

        <details class="p-section" data-part="allegati">
          <summary>Allegati (<span id="attach-count">0</span>)</summary>
          <ul id="attach-list" class="p-files"></ul>
        </details>

        <details class="p-section" data-part="cronologia">
          <summary>Aggiornamenti</summary>
          <div id="timeline" class="p-timeline"></div>
        </details>

        <details class="p-section" data-part="comunicazioni">
          <summary>Comunicazioni (<span id="comm-count">0</span>)</summary>
          <div id="comm-list"></div>
        </details>
      </div>
    </article>
  </main>

  <script src="../assets/prosit.js"></script>
  <script src="../assets/prosit-api-v2.js"></script>
  <script src="disservizio.js?v=2"></script>
</body>
</html>
